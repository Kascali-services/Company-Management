version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: companies_db
    environment:
      POSTGRES_USER: companies_db
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: companies_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companies_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: fastapi_app
    environment:
      DATABASE_URL: postgresql://companies_db:securepassword123@db:5432/companies_db
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
